<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Digigrow Solution — digigrowsolutions.in">
<meta name="description" content="Talk to RESHAM · Lucknow Silk — studio address, email, phone and a quick contact form.">
<title>Contact · RESHAM - Lucknow Silk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Anton&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%2712%27 fill=%27%235c0e1a%27/%3E%3Ctext x=%2712%27 y=%2717%27 font-size=%2713%27 text-anchor=%27middle%27 fill=%27%23f0c76a%27 font-family=%27serif%27 font-weight=%27bold%27%3ER%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="contact">
<header class="nav-wrap" id="pageNav"></header>

<main class="page">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i>/</i><b>Contact</b></nav>
  <div class="page-head">
    <h1 class="page-title">Come, have a <em>chai.</em></h1>
    <p class="page-sub">Questions on a drape, a bulk order, a wedding trousseau — the studio door is open.</p>
  </div>

  <div class="contact-grid">
    <div class="contact-cards">
      <div class="contact-card">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
        <span><b>Write to us</b><small id="ctEmail"></small></span>
      </div>
      <div class="contact-card">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
        <span><b>Call the studio</b><small id="ctPhone"></small></span>
      </div>
      <div class="contact-card">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span><b>Flagship store</b><small id="ctAddr"></small><br><small>Open 11 am – 8 pm · Closed Tuesdays</small></span>
      </div>
      <div class="contact-card">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M4 5h16v14H4zM8 19v-4M16 19v-4M4 10h16"/></svg>
        <span><b>WhatsApp</b><small id="ctWhats"></small><br><small>Fastest for order updates and fabric photos.</small></span>
      </div>
    </div>

    <form class="panel" id="contactForm" novalidate style="margin:0">
      <h3 style="margin-bottom:20px">Send a note</h3>
      <div class="form-grid">
        <div class="field"><label for="cName">Your name</label><input id="cName" required placeholder="Name"></div>
        <div class="field"><label for="cEmail">Email</label><input id="cEmail" type="email" required placeholder="you@example.com"></div>
        <div class="field full"><label for="cOrder">Order number <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="cOrder" placeholder="RS2601xx-xxxx"></div>
        <div class="field full"><label for="cMsg">Message</label><textarea id="cMsg" rows="5" required placeholder="Tell us what you are looking for…"></textarea></div>
      </div>
      <button class="btn btn-red" type="submit" style="margin-top:16px;width:100%;justify-content:center;height:48px">Send message</button>
      <p class="demo-note" style="text-align:center;margin-top:10px;font-size:11.5px;color:var(--ink-soft)">Demo form · nothing is transmitted</p>
    </form>
  </div>
</main>

<footer class="footer" id="pageFooter"></footer>
<div class="subticker" aria-hidden="true"><div id="subTickerTrack"></div></div>
<div class="subtoast" id="subtoast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/chrome.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
